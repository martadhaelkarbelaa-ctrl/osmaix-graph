name: Build public OSM road graph
on:
  schedule:
    - cron: '0 3 * * 5'
  workflow_dispatch:
    inputs:
      region:
        description: Region
        type: choice
        options: [karbala]
        default: karbala
permissions:
  contents: write
concurrency:
  group: osm-graph-${{ github.event.inputs.region || 'karbala' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REGION: ${{ github.event.inputs.region || 'karbala' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/graph_builder/requirements.txt
      - name: Check PyPI releases and install recorded dependencies
        run: python tools/graph_builder/install_ci_dependencies.py --output out/build_dependencies.json
      - name: Install OSM extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y osmium-tool
      - name: Fixture acceptance tests
        run: python -m pytest tools/graph_builder/tests -q
      - name: Download OSM source and derive actual governorate bounds
        run: |
          mkdir -p work out
          curl --fail --location --retry 3 --max-time 900 \
            https://download.geofabrik.de/asia/iraq-latest.osm.pbf -o work/iraq.osm.pbf
          python tools/graph_builder/resolve_region.py work/iraq.osm.pbf \
            --region "$REGION" --output work/region.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          config=json.loads(Path('work/region.json').read_text())
          south,west,north,east=config['bbox']
          subprocess.run(['osmium','extract','-b',f'{west},{south},{east},{north}',
              '--strategy=complete_ways','work/iraq.osm.pbf','-o','work/region.osm.pbf'],check=True)
          subprocess.run(['osmium','tags-filter','work/region.osm.pbf',
              'w/highway','r/type=restriction','-o','work/roads.osm.pbf'],check=True)
          subprocess.run(['python','tools/graph_builder/graph_builder.py','work/roads.osm.pbf',
              '--region',os.environ['REGION'],'--bbox',*map(str,config['bbox']),
              '--source-timestamp',config['sourceTimestamp'],'--output','out'],check=True)
          PY
      - name: Validate real output and compare repeated PBF builds
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'tools/graph_builder')
          from graph_builder import build, read_osm
          from inspect_graph import inspect
          manifest=json.loads(Path('out/manifest.json').read_text())
          data=Path('out',manifest['file']).read_bytes()
          graph=inspect(data,manifest)
          rebuilt,_,_=build(*read_osm('work/roads.osm.pbf'),os.environ['REGION'],
                           manifest['bbox'],manifest['sourceTimestamp'])
          assert data == rebuilt, 'Real PBF graph is not deterministic'
          report=json.loads(Path('out/report.json').read_text())
          assert report['edges'] > 100, 'Suspiciously empty regional graph'
          assert report['largestCarWeakComponentEdges'] > 100, 'Missing car network'
          assert report['largestCarWeakComponentRatio'] >= 0.9, (
              'CAR weak connectivity below 0.9; inspect report components before publishing: '
              + str(report['otherCarWeakComponentsOver20']))
          date=__import__('datetime').datetime.fromtimestamp(
              manifest['sourceTimestamp']/1000,__import__('datetime').timezone.utc).strftime('%Y%m%d')
          tag=f"graph-{os.environ['REGION']}-{date}"
          # Immutable dated URL; graph-latest is updated only after dated upload succeeds.
          manifest['downloadUrl']=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{manifest['file']}"
          Path('out/manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('out/SHA256SUMS').write_text(manifest['sha256']+'  '+manifest['file']+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('GRAPH_TAG='+tag+'\n')
          PY
      - name: Keep CI output for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-${{ env.REGION }}
          path: out/
          if-no-files-found: warn
      - name: Publish OSM-derived graph only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GRAPH_TAG" >/dev/null 2>&1; then
            gh release create "$GRAPH_TAG" --title "$GRAPH_TAG" \
              --notes '© OpenStreetMap contributors. ODbL-1.0. See report.json for unsupported restrictions. No personal GPS or overlays.'
          fi
          gh release upload "$GRAPH_TAG" out/* --clobber
          if ! gh release view graph-latest >/dev/null 2>&1; then
            gh release create graph-latest --title 'Latest regional graph manifest' \
              --notes 'Manifest points to a dated graph release. © OpenStreetMap contributors, ODbL-1.0.'
          fi
          gh release upload graph-latest out/manifest.json --clobber
